name: Déploiement o2switch

# Déploie l'API Laravel (api/) et la SPA Vue (app/) sur un hébergement
# mutualisé o2switch (cPanel / Apache) via SSH + rsync.
#
# ⚠️ ALTERNATIVE MANUELLE. À n'utiliser que si l'accès SSH ENTRANT au serveur
#    o2switch est ouvert depuis les runners GitHub. Si le SSH est filtré par
#    le pare-feu de l'hébergeur (timeout sur le port 22), utilisez plutôt le
#    workflow « pull » o2switch-deploy.yml (déploiement via cPanel Git).
#
# Déclenchement : MANUEL uniquement (onglet Actions → « Run workflow »).
#
# Configuration requise (Settings → Secrets and variables → Actions) :
#
#   Secrets :
#     O2SWITCH_SSH_HOST        Hôte SSH (ex: nom-serveur.o2switch.net)
#     O2SWITCH_SSH_USER        Utilisateur cPanel (ex: moncompte)
#     O2SWITCH_SSH_KEY         Clé privée SSH (contenu complet, format OpenSSH)
#
#   Variables :
#     O2SWITCH_SSH_PORT        Port SSH (défaut: 22)
#     O2SWITCH_API_PATH        Chemin de déploiement de l'API
#                              (ex: /home/moncompte/fanch-api)
#     O2SWITCH_APP_PATH        Web root de la SPA
#                              (ex: /home/moncompte/public_html
#                               ou /home/moncompte/app.mondomaine.fr)
#     O2SWITCH_PHP_BIN         Binaire PHP CLI 8.4 (défaut: php)
#     VITE_API_URL             URL publique de l'API consommée par la SPA
#                              (ex: https://api.mondomaine.fr/api)
#     O2SWITCH_KEEP_RELEASES   Nombre de releases à conserver (défaut: 5)
#
# Voir deploy/o2switch/README.md pour la mise en place complète côté serveur.

on:
  workflow_dispatch:

# Empêche deux déploiements simultanés (bascule de symlink non concurrente).
concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & déploiement
    runs-on: ubuntu-latest
    environment: recette

    env:
      PHP_BIN: ${{ vars.O2SWITCH_PHP_BIN || 'php' }}
      API_PATH: ${{ vars.O2SWITCH_API_PATH }}
      APP_PATH: ${{ vars.O2SWITCH_APP_PATH }}
      SSH_HOST: ${{ secrets.O2SWITCH_SSH_HOST }}
      SSH_USER: ${{ secrets.O2SWITCH_SSH_USER }}
      SSH_PORT: ${{ vars.O2SWITCH_SSH_PORT || '22' }}
      KEEP_RELEASES: ${{ vars.O2SWITCH_KEEP_RELEASES || '5' }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Garde-fou : vérifie que la configuration minimale est présente.
      # ----------------------------------------------------------------
      - name: Vérification de la configuration
        run: |
          missing=0
          for v in SSH_HOST SSH_USER API_PATH APP_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error::Variable/secret manquant : $v"
              missing=1
            fi
          done
          if [ -z "${{ secrets.O2SWITCH_SSH_KEY }}" ]; then
            echo "::error::Secret manquant : O2SWITCH_SSH_KEY"
            missing=1
          fi
          [ "$missing" = "0" ] || { echo "Voir deploy/o2switch/README.md"; exit 1; }

          # Avertissement si les chemins ne sont pas dans le dossier personnel :
          # sur un mutualisé o2switch, seul /home/<compte>/... est inscriptible.
          for p in API_PATH APP_PATH; do
            case "${!p}" in
              /home/*) : ;;
              *) echo "::warning::$p='${!p}' ne commence pas par /home/. Sur o2switch, utilisez un chemin dans votre dossier personnel (ex: /home/moncompte/api.tyfanch.bzh), sinon rsync échouera avec 'Permission denied'." ;;
            esac
          done

      # ----------------------------------------------------------------
      # Build de l'API Laravel (PHP 8.4)
      # ----------------------------------------------------------------
      - name: Configuration de PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, filter, hash, json, openssl, pcre, pdo, session, tokenizer, xml
          tools: composer:v2
          coverage: none

      - name: Fichier .env de build (temporaire, non déployé)
        working-directory: api
        run: cp .env.example .env

      - name: Installation des dépendances Composer (production)
        working-directory: api
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            app/package-lock.json

      - name: Build des assets de l'API (Laravel Vite)
        working-directory: api
        run: |
          npm ci
          npm run build

      # ----------------------------------------------------------------
      # Build de la SPA Vue
      # ----------------------------------------------------------------
      - name: Build de la SPA Vue
        working-directory: app
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          # VITE_API_URL doit être une VARIABLE de dépôt (Settings > Secrets and
          # variables > Actions > onglet Variables — PAS Secrets), sinon la SPA
          # est buildée sur l'URL de dev (http://127.0.0.1:8000/api).
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::La variable VITE_API_URL est vide. Créez-la dans Settings > Secrets and variables > Actions > onglet 'Variables' (ex: https://api.tyfanch.bzh/api)."
            exit 1
          fi
          # On l'écrit dans un .env.production : Vite charge ce fichier de façon
          # déterministe au build (plus fiable que de dépendre de process.env).
          echo "VITE_API_URL=${VITE_API_URL}" > .env.production
          echo "Build SPA avec VITE_API_URL=${VITE_API_URL}"
          npm run build
          echo "Vérification (occurrences de l'URL dans le build) :"
          grep -rc "$VITE_API_URL" dist/assets >/dev/null && echo "  URL API bien intégrée." || echo "::warning::URL API introuvable dans le build."

      # ----------------------------------------------------------------
      # Préparation de la connexion SSH
      # ----------------------------------------------------------------
      - name: Configuration de la clé SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.O2SWITCH_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Récupération de la clé d'hôte, NON bloquante : si le serveur ne
          # répond pas à ssh-keyscan, on n'échoue pas ici (l'option
          # StrictHostKeyChecking=accept-new ajoutera la clé à la première
          # connexion réelle, où l'erreur serait bien plus explicite).
          if ! ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::warning::ssh-keyscan n'a pas pu récupérer la clé d'hôte de $SSH_HOST:$SSH_PORT — bascule sur accept-new."
          fi
          echo "SSH_OPTS=-i $HOME/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30" >> "$GITHUB_ENV"

      - name: Test de connexion SSH
        run: |
          echo "Test de connexion à $SSH_USER@$SSH_HOST:$SSH_PORT ..."
          if ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" 'echo "Connexion SSH établie sur $(hostname)"'; then
            echo "Connexion SSH OK."
            exit 0
          fi
          # Échec : on relance en mode verbeux pour rendre la cause visible
          # (timeout réseau, clé refusée, mauvais port, host inconnu...).
          echo "::group::Diagnostic SSH détaillé (ssh -v)"
          ssh -v $SSH_OPTS "$SSH_USER@$SSH_HOST" 'true' || true
          echo "::endgroup::"
          echo "::error::Connexion SSH impossible vers $SSH_HOST:$SSH_PORT (utilisateur $SSH_USER). Voir le diagnostic ci-dessus."
          echo "::error::Pistes : (1) O2SWITCH_SSH_HOST/USER/PORT corrects ? (2) clé publique de O2SWITCH_SSH_KEY autorisée dans cPanel > Accès SSH ? (3) accès SSH activé et bon port ?"
          exit 1

      # ----------------------------------------------------------------
      # Déploiement de l'API : rsync du code vers une nouvelle release,
      # puis exécution du script distant (migrations, caches, bascule).
      # ----------------------------------------------------------------
      - name: Déploiement de l'API (rsync + release)
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          RELEASE_DIR="$API_PATH/releases/$RELEASE"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$RELEASE_DIR'"

          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '.env' \
            --exclude 'storage/logs/*' \
            -e "ssh $SSH_OPTS" \
            api/ "$SSH_USER@$SSH_HOST:$RELEASE_DIR/"

          # Envoi + exécution du script de déploiement distant.
          scp $SSH_OPTS deploy/o2switch/deploy-remote.sh \
            "$SSH_USER@$SSH_HOST:$RELEASE_DIR/deploy-remote.sh"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "API_PATH='$API_PATH' RELEASE='$RELEASE' PHP_BIN='$PHP_BIN' KEEP_RELEASES='$KEEP_RELEASES' bash '$RELEASE_DIR/deploy-remote.sh'"

      # ----------------------------------------------------------------
      # Déploiement de la SPA : rsync du build statique vers le web root.
      # ----------------------------------------------------------------
      - name: Déploiement de la SPA (rsync)
        run: |
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_PATH'"
          rsync -az --delete \
            -e "ssh $SSH_OPTS" \
            app/dist/ "$SSH_USER@$SSH_HOST:$APP_PATH/"

      - name: Nettoyage de la clé SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Récapitulatif
        run: |
          echo "### Déploiement o2switch terminé :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release API** : \`$RELEASE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API** : \`$API_PATH/current/public\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SPA** : \`$APP_PATH\`" >> "$GITHUB_STEP_SUMMARY"
